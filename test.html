<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Погода Тула</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    background:#f6f8fb;
    color:#1e293b;
    padding:40px 20px;
}

.container{
    max-width:1200px;
    margin:0 auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:40px;
}

.title h1{
    font-size:42px;
    font-weight:800;
    color:#0f172a;
    margin-bottom:8px;
}

.title p{
    color:#64748b;
    font-size:16px;
}

.badge{
    background:white;
    border-radius:18px;
    padding:14px 20px;
    box-shadow:0 10px 25px rgba(15,23,42,0.08);
    font-weight:600;
    color:#2563eb;
}

#loading{
    background:white;
    border-radius:20px;
    padding:18px 24px;
    width:fit-content;
    margin-bottom:30px;
    box-shadow:0 10px 25px rgba(15,23,42,0.08);
    color:#475569;
    font-weight:600;
}

#weather{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:24px;
}

.card{
    background:white;
    border-radius:28px;
    padding:26px;
    position:relative;
    overflow:hidden;
    transition:0.3s ease;
    box-shadow:0 15px 35px rgba(15,23,42,0.08);
    border:1px solid rgba(148,163,184,0.15);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 22px 45px rgba(15,23,42,0.14);
}

.card::after{
    content:"";
    position:absolute;
    top:-40px;
    right:-40px;
    width:120px;
    height:120px;
    background:linear-gradient(135deg,#60a5fa,#38bdf8);
    border-radius:50%;
    opacity:0.12;
}

.day{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.day h3{
    font-size:20px;
    font-weight:700;
    color:#0f172a;
}

.icon{
    font-size:30px;
}

.temp{
    display:flex;
    align-items:flex-end;
    gap:12px;
    margin-bottom:26px;
}

.temp-main{
    font-size:48px;
    line-height:1;
    font-weight:800;
    color:#2563eb;
}

.temp-small{
    color:#64748b;
    font-size:18px;
    font-weight:600;
    margin-bottom:6px;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f8fafc;
    padding:14px 16px;
    border-radius:16px;
}

.label{
    color:#64748b;
    font-size:14px;
    font-weight:600;
}

.wind{
    color:#0f172a;
    font-weight:800;
}

@media(max-width:700px){

    body{
        padding:24px 16px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .title h1{
        font-size:34px;
    }

    .temp-main{
        font-size:40px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="title">
            <h1>Погода в Туле</h1>
            <p>Актуальный прогноз на ближайшие дни</p>
        </div>

        <div class="badge">
            ☀️ Open Meteo Forecast
        </div>

    </div>

    <div id="loading">
        Загрузка прогноза...
    </div>

    <div id="weather"></div>

</div>

<script>

async function getWeather(){

    const url = "https://api.open-meteo.com/v1/forecast?latitude=54.1961&longitude=37.6182&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Europe/Moscow";

    try{

        const response = await fetch(url);

        const data = await response.json();

        console.log(data);

        document.getElementById("loading").style.display = "none";

        const weather = document.getElementById("weather");

        for(let i = 0; i < data.daily.time.length; i++){

            const card = document.createElement("div");

            card.className = "card";

            card.
innerHTML = `
                <div class="day">
                    <h3>${data.daily.time[i]}</h3>
                    <div class="icon">☁️</div>
                </div>

                <div class="temp">
                    <div class="temp-main">
                        ${data.daily.temperature_2m_max[i]}°
                    </div>

                    <div class="temp-small">
                        мин. ${data.daily.temperature_2m_min[i]}°C
                    </div>
                </div>

                <div class="info">
                    <span class="label">Скорость ветра</span>

                    <span class="wind">
                        ${data.daily.wind_speed_10m_max[i]} км/ч
                    </span>
                </div>
            `;

            weather.appendChild(card);
        }

    }
    catch(error){

        console.log(error);

        document.getElementById("loading").innerHTML =
        "Ошибка загрузки";
    }
}

getWeather();

</script>

</body>
</html>
