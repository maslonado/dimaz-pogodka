<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Погода Тула</title>

<style>

body{
    font-family: Arial;
    background:#f0f4f8;
    padding:20px;
}

h1{
    text-align:center;
}

#weather{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.temp{
    font-size:28px;
    color:blue;
}

</style>
</head>

<body>

<h1>Погода в Туле на неделю</h1>

<div id="loading">
Загрузка...
</div>

<div id="weather"></div>

<script>

async function getWeather(){

    const url = "https://api.open-meteo.com/v1/forecast?latitude=54.1961&longitude=37.6182&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Europe/Moscow";

    try{

        const response = await fetch(url);

        const data = await response.json();

        console.log(data);

        document.getElementById("loading").style.display = "none";

        const weather = document.getElementById("weather");

        for(let i = 0; i < data.daily.time.length; i++){

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <h3>${data.daily.time[i]}</h3>

                <div class="temp">
                    ${data.daily.temperature_2m_min[i]}°C /
                    ${data.daily.temperature_2m_max[i]}°C
                </div>

                <p>
                    Ветер:
                    ${data.daily.wind_speed_10m_max[i]} км/ч
                </p>
            `;

            weather.appendChild(card);
        }

    }
    catch(error){

        console.log(error);

        document.getElementById("loading").innerHTML =
        "Ошибка загрузки";
    }
}

getWeather();

</script>

</body>
</html>
